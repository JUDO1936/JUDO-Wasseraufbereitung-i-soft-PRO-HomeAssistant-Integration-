      {% else %}
        {{ states('sensor.isoft_wasser_jahr_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_wasser_jahr_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/F700"
    username: "admin"
    password: "Connectivity"
    scan_interval: 120
    name: "i-soft Volumenstrom Tag (JUDO Rohwert)"
    unique_id: isoft_volumen_tag_raw
    icon: mdi:chart-line
    unit_of_measurement: "L/h"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
        {{ (hex[2:4] ~ hex[0:2]) | int(base=16) }}
      {% else %}
