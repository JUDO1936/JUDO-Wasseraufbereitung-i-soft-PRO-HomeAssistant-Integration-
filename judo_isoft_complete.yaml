    value_template: >-
      {% if value_json is defined and value_json.data is defined and value_json.data | length >= 8 %}
        {% set hex = value_json.data %}
        {% set minutes = hex[0:2] | int(base=16) %}
        {% set hours = hex[2:4] | int(base=16) %}
        {% set days = (hex[4:8]) | int(base=16) %}
        {{ days }} Tage, {{ hours }} Stunden
      {% else %}
        {{ states('sensor.isoft_betriebstage_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_betriebstage_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/0E00" # Inbetriebnahmedatum
    username: "admin"
    password: "Connectivity"
    scan_interval: 86400
    name: "i-soft Inbetriebnahmedatum (JUDO Rohwert)"
    unique_id: isoft_inbetriebnahme_raw
    icon: mdi:calendar-start
    device_class: date
    value_template: >-
      {% if value_json is defined and value_json.data is defined and value_json.data | length >= 8 %}
        {% set hex = value_json.data %}
        {% set day = hex[0:2] | int(base=16) %}
        {% set month = hex[2:4] | int(base=16) %}
        {% set year = (hex[4:8] | int(base=16)) %}
        {{ '%04d-%02d-%02d' | format(year, month, day) }}
      {% else %}
        {{ states('sensor.isoft_inbetriebnahme_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_inbetriebnahme_raw
  - platform: rest
