# ==============================================================================
# JUDO i-soft PRO / L - Vollständige Integration (HTTP Basic Auth)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HELFER (DASHBOARD-STEUERUNG)
# ------------------------------------------------------------------------------
input_text:
  isoft_ip:
    name: "i-soft IP-Adresse"
    initial: "192.168.178.2"
    min: 7
    max: 15
    mode: text

input_number:
  isoft_wunschwasserhaerte_eingabe:
    name: "i-soft Wunschwasserhärte"
    min: 0
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: "°"
    icon: mdi:water-opacity

  isoft_salzmangel_warnung_eingabe:
    name: "i-soft Salzmangel-Warnung"
    min: 0
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: "Tage"
    icon: mdi:alert-circle-outline

  isoft_max_entnahmemenge_eingabe:
    name: "i-soft Max. Entnahmemenge"
    min: 100
    max: 3000
    step: 100
    mode: slider
    unit_of_measurement: "L"
    icon: mdi:water-minus

  isoft_max_volumenstrom_eingabe:
    name: "i-soft Max. Volumenstrom"
    min: 500
    max: 5000
    step: 250
    mode: slider
    unit_of_measurement: "L/h"
    icon: mdi:speedometer

  isoft_urlaubsmodus_tage:
    name: "i-soft Urlaubstage"
    min: 1
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: "Tage"
    icon: mdi:beach

input_select:
  isoft_haerteeinheit_auswahl:
    name: "i-soft Härteeinheit"
    options:
      - "0 - °dH"
      - "1 - °eH"
      - "2 - °fH"
      - "3 - gpg"
      - "4 - ppm"
      - "5 - mmol"
      - "6 - mval"
    icon: mdi:format-letter-case

  isoft_szene_auswahl:
    name: "i-soft Szene"
    options:
      - "0 - Alltag meistern"
      - "1 - Körper pflegen"
      - "2 - Garten bewässern"
      - "3 - Urlaub genießen"
      - "4 - Wäsche waschen"
      - "5 - Hochdruckreinigen"
      - "6 - Pool befüllen"
      - "7 - Heizung befüllen"
      - "8 - Custom Szene 1"
      - "9 - Custom Szene 2"
      - "A - Custom Szene 3"
    icon: mdi:palette-swatch

  isoft_szene_dauer_auswahl:
    name: "i-soft Szenendauer"
    options:
      - "15 Minuten - 000F"
      - "30 Minuten - 001E"
      - "45 Minuten - 002D"
      - "60 Minuten / 1 Std - 0100"
      - "2 Stunden - 0200"
      - "6 Stunden - 0600"
      - "12 Stunden - 0C00"
      - "Dauerhaft - FFFF"
    icon: mdi:timer-outline

  isoft_entnahmedauer_auswahl:
    name: "i-soft Max. Entnahmedauer"
    options:
      - "10 min"
      - "20 min"
      - "30 min"
      - "40 min"
      - "50 min"
      - "60 min"
      - "70 min"
      - "80 min"
      - "90 min"
      - "120 min"
      - "150 min"
      - "180 min"
      - "210 min"
      - "240 min"
      - "270 min"
      - "300 min"
      - "330 min"
      - "360 min"
      - "390 min"
      - "420 min"
      - "450 min"
      - "480 min"
      - "510 min"
      - "540 min"
      - "570 min"
      - "600 min"
    icon: mdi:timer-cog

# ------------------------------------------------------------------------------
# 2. REST COMMANDS (SCHREIBEN)
# ------------------------------------------------------------------------------
rest_command:
  isoft_regeneration_starten:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/350000"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_wunschwasserhaerte_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3000{{ '%02X' | format(haerte | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_szene_aktivieren:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3600{{ '%02X' | format(szene | int) }}{{ dauer_hex | upper }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_szene_zuruecksetzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3800{{ '%02X' | format(szene | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_salzmangel_warnung_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/5700{{ '%02X' | format(tage | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_haerteeinheit_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/2400{{ '%02X' | format(einheit_id | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_leckageschutz_schliessen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3C00"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_leckageschutz_oeffnen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3D00"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_max_entnahmedauer_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3E00{{ '%02X' | format(minuten | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_max_entnahmemenge_setzen:
    url: >-
      http://{{ states('input_text.isoft_ip') }}/api/rest/3F00{{ '%02X' | format((liter | int) % 256) }}{{ '%02X' | format((liter | int) // 256) }}
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_max_volumenstrom_setzen:
    url: >-
      http://{{ states('input_text.isoft_ip') }}/api/rest/4000{{ '%02X' | format((liter_pro_stunde | int) % 256) }}{{ '%02X' | format((liter_pro_stunde | int) // 256) }}
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_urlaubsmodus_starten:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/410001{{ '%02X' | format(tage | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"
    
# 4. SKRIPTE (LOGIK)
# ------------------------------------------------------------------------------
script:
  isoft_set_wunschwasserhaerte_ui:
    alias: i-soft - Wunschwasserhaerte setzen
    mode: single
    sequence:
      - action: rest_command.isoft_wunschwasserhaerte_setzen
        data:
          haerte: "{{ states('input_number.isoft_wunschwasserhaerte_eingabe') | int }}"
      - delay:
          seconds: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.i_soft_wunschwasserhaerte

  isoft_set_haerteeinheit_ui:
    alias: i-soft - Haerteeinheit setzen
    mode: single
    sequence:
      - variables:
          unit_id: "{{ states('input_select.isoft_haerteeinheit_auswahl')[0] | int }}"
      - action: rest_command.isoft_haerteeinheit_setzen
        data:
          einheit_id: "{{ unit_id }}"
      - delay:
          seconds: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.i_soft_haerteeinheit

  isoft_activate_scene_ui:
    alias: i-soft - Szene sofort aktivieren
    mode: single
    sequence:
      - variables:
          scene_name: "{{ states('input_select.isoft_szene_auswahl') }}"
          scene_id: >-
            {% set m = {
              '0 - Alltag meistern': 0,
              '1 - Körper pflegen': 1,
              '2 - Garten bewässern': 2,
              '3 - Urlaub genießen': 3,
              '4 - Wäsche waschen': 4,
              '5 - Hochdruckreinigen': 5,
              '6 - Pool befüllen': 6,
              '7 - Heizung befüllen': 7,
              '8 - Custom Szene 1': 8,
              '9 - Custom Szene 2': 9,
              'A - Custom Szene 3': 10
            } %}
            {{ m[scene_name] }}
          duration_hex: >-
            {% set m = {
              '15 Minuten - 000F': '000F',
              '30 Minuten - 001E': '001E',
              '45 Minuten - 002D': '002D',
              '60 Minuten / 1 Std - 0100': '0100',
              '2 Stunden - 0200': '0200',
              '6 Stunden - 0600': '0600',
              '12 Stunden - 0C00': '0C00',
              'Dauerhaft - FFFF': 'FFFF'
            } %}
            {{ m[states('input_select.isoft_szene_dauer_auswahl')] }}
      - action: rest_command.isoft_szene_aktivieren
        data:
          szene: "{{ scene_id | int }}"
          dauer_hex: "{{ duration_hex }}"

  isoft_reset_scene_ui:
    alias: i-soft - Szene zuruecksetzen
    mode: single
    sequence:
      - variables:
          scene_name: "{{ states('input_select.isoft_szene_auswahl') }}"
          scene_id: >-
            {% set m = {
              '0 - Alltag meistern': 0,
              '1 - Körper pflegen': 1,
              '2 - Garten bewässern': 2,
              '3 - Urlaub genießen': 3,
              '4 - Wäsche waschen': 4,
              '5 - Hochdruckreinigen': 5,
              '6 - Pool befüllen': 6,
              '7 - Heizung befüllen': 7,
              '8 - Custom Szene 1': 8,
              '9 - Custom Szene 2': 9,
              'A - Custom Szene 3': 10
            } %}
            {{ m[scene_name] }}
      - action: rest_command.isoft_szene_zuruecksetzen
        data:
          szene: "{{ scene_id | int }}"

  isoft_set_salt_warning_ui:
    alias: i-soft - Salzmangelwarnung setzen
    mode: single
    sequence:
      - action: rest_command.isoft_salzmangel_warnung_setzen
        data:
          tage: "{{ states('input_number.isoft_salzmangel_warnung_eingabe') | int }}"
      - delay:
          seconds: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.i_soft_salzmangel_warnschwelle

  isoft_set_max_duration_ui:
    alias: i-soft - Max. Entnahmedauer setzen
    mode: single
    sequence:
      - variables:
          minutes: "{{ states('input_select.isoft_entnahmedauer_auswahl').split(' ')[0] | int }}"
      - choose:
          - conditions: "{{ minutes <= 255 }}"
            sequence:
              - action: rest_command.isoft_max_entnahmedauer_setzen
                data:
                  minuten: "{{ minutes }}"
              - delay:
                  seconds: 2
              - action: homeassistant.update_entity
                target:
                  entity_id: sensor.i_soft_max_entnahmedauer
          - conditions: "{{ minutes > 255 }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: i-soft Entnahmedauer nicht gesendet
                  message: >-
                    {{ minutes }} Minuten können nicht als Byte übertragen werden (Max. 255 min).

  isoft_set_max_volume_ui:
    alias: i-soft - Max. Entnahmemenge setzen
    mode: single
    sequence:
      - action: rest_command.isoft_max_entnahmemenge_setzen
        data:
          liter: "{{ states('input_number.isoft_max_entnahmemenge_eingabe') | int }}"
      - delay:
          seconds: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.i_soft_max_entnahmemenge

  isoft_set_max_flow_ui:
    alias: i-soft - Max. Volumenstrom setzen
    mode: single
    sequence:
      - action: rest_command.isoft_max_volumenstrom_setzen
        data:
          liter_pro_stunde: "{{ states('input_number.isoft_max_volumenstrom_eingabe') | int }}"
      - delay:
          seconds: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.i_soft_max_volumenstrom

  isoft_start_regeneration_ui:
    alias: i-soft - Regeneration starten
    mode: single
    sequence:
      - action: rest_command.isoft_regeneration_starten

  isoft_leak_close_ui:
    alias: i-soft - Leckageschutz schliessen
    mode: single
    sequence:
      - action: rest_command.isoft_leckageschutz_schliessen

  isoft_leak_open_ui:
    alias: i-soft - Leckageschutz öffnen
    mode: single
    sequence:
      - action: rest_command.isoft_leckageschutz_oeffnen

  isoft_start_holiday_ui:
    alias: i-soft - Urlaubsmodus starten
    mode: single
    sequence:
      - action: rest_command.isoft_urlaubsmodus_starten
        data:
          tage: "{{ states('input_number.isoft_urlaubsmodus_tage') | int }}"

# ------------------------------------------------------------------------------
# 5. AUTOMATION: AUTOMATISCHES ABFRAGEN NACH 5 SEKUNDEN
# ------------------------------------------------------------------------------
automation:
  - alias: "i-soft: Werte nach UI-Änderung aktualisieren"
    id: isoft_auto_refresh_after_change
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.isoft_wunschwasserhaerte_eingabe
          - input_select.isoft_haerteeinheit_auswahl
          - input_select.isoft_entnahmedauer_auswahl
          - input_number.isoft_max_entnahmemenge_eingabe
          - input_number.isoft_max_volumenstrom_eingabe
          - input_number.isoft_salzmangel_warnung_eingabe
          - input_number.isoft_urlaubsmodus_tage
          - input_select.isoft_szene_auswahl
    action:
      - delay: "00:00:05"
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.i_soft_wunschwasserhaerte
            - sensor.i_soft_haerteeinheit
            - sensor.i_soft_max_entnahmedauer
            - sensor.i_soft_max_entnahmemenge
            - sensor.i_soft_max_volumenstrom
            - sensor.i_soft_salzmangel_warnschwelle
            - sensor.i_soft_salzgewicht
            - sensor.i_soft_salzreichweite
