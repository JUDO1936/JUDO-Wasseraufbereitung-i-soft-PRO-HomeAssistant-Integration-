    icon: mdi:timer-outline
    unit_of_measurement: "min"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {{ value_json.data[0:2] | int(base=16) }}
      {% else %}
        {{ states('sensor.isoft_max_entnahmedauer_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_max_entnahmedauer_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/3F00" # Max. Entnahmemenge
    username: "admin"
    password: "Connectivity"
    scan_interval: 120
    name: "i-soft Max Entnahmemenge (JUDO Rohwert)"
    unique_id: isoft_max_entnahmemenge_raw
    icon: mdi:water-minus
    unit_of_measurement: "L"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
