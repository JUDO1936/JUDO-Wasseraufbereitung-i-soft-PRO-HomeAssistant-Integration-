    username: "admin"
    password: "Connectivity"
    scan_interval: 86400
    name: "i-soft Kundendienst Telefon (JUDO Rohwert)"
    unique_id: isoft_kd_telefon_raw
    icon: mdi:phone-outline
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {{ value_json.data }}
      {% else %}
        {{ states('sensor.isoft_kd_telefon_raw') }}
      {% endif %}


