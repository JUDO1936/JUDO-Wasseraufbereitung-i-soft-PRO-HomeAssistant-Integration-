        {% set hex = value_json.data %}
        {{ (hex[6:8] ~ hex[4:6] ~ hex[2:4] ~ hex[0:2]) | int(base=16) }}
      {% else %}
        {{ states('sensor.isoft_wasser_monat_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_wasser_monat_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/FE00"
    username: "admin"
    password: "Connectivity"
    scan_interval: 120
    name: "i-soft Wasserverbrauch Jahr (JUDO Rohwert)"
    unique_id: isoft_wasser_jahr_raw
    icon: mdi:chart-bar
    unit_of_measurement: "L"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
