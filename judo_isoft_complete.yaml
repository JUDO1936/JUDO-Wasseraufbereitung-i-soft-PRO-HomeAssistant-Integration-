    default_entity_id: sensor.isoft_max_entnahmemenge_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/4000" # Max. Volumenstrom
    username: "admin"
    password: "Connectivity"
    scan_interval: 120
    name: "i-soft Max Volumenstrom (JUDO Rohwert)"
    unique_id: isoft_max_volumenstrom_raw
    icon: mdi:speedometer
    unit_of_measurement: "L/h"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
        {{ (hex[2:4] ~ hex[0:2]) | int(base=16) }}
      {% else %}
        {{ states('sensor.isoft_max_volumenstrom_raw') }}
      {% endif %}


  # --- 4. Geräte- & Infodaten ---
    default_entity_id: sensor.isoft_max_volumenstrom_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/FF00" # Gerätetyp
    username: "admin"
    password: "Connectivity"
    scan_interval: 86400
    name: "i-soft Geraetetyp (JUDO Rohwert)"
    unique_id: isoft_geraetetyp_raw
    icon: mdi:chip
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set typ = value_json.data[0:2] | upper %}
        {% if typ in ['58', '4B'] %}
          i-soft PRO
        {% elif typ == '4C' %}
          i-soft PRO L
        {% else %}
          {{ typ }}
        {% endif %}
      {% else %}
        {{ states('sensor.isoft_geraetetyp_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_geraetetyp_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/0600" # Gerätenummer laut API-Doku
    username: "admin"
    password: "Connectivity"
    scan_interval: 86400
    name: "i-soft Gerätenummer (JUDO Rohwert)"
    unique_id: isoft_geraetenummer_raw
    icon: mdi:identifier
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
        {% if hex | length >= 8 %}
          {{ (hex[6:8] ~ hex[4:6] ~ hex[2:4] ~ hex[0:2]) | int(base=16) }}
        {% else %}
          {{ states('sensor.isoft_geraetenummer_raw') }}
        {% endif %}
      {% else %}
        {{ states('sensor.isoft_geraetenummer_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_geraetenummer_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/0100" # Firmware Version
    username: "admin"
    password: "Connectivity"
    scan_interval: 86400
    name: "i-soft Firmware Version (JUDO Rohwert)"
    unique_id: isoft_firmware_version_raw
    icon: mdi:file-code-outline
    value_template: >-
      {% if value_json is defined and value_json.data is defined and value_json.data | length >= 6 %}
        {% set hex = value_json.data %}
        {# Die Doku zeigt 0C0001 als Version 1.0.12: Byte-Reihenfolge ist daher rückwärts. #}
        {{ (hex[4:6]|int(base=16)) ~ '.' ~ (hex[2:4]|int(base=16)) ~ '.' ~ (hex[0:2]|int(base=16)) }}
      {% else %}
        {{ states('sensor.isoft_firmware_version_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_firmware_version_raw
  - platform: rest
