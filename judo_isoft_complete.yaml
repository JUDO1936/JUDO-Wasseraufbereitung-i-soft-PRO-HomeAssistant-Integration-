input_text:
  isoft_ip:
    name: "i-soft IP-Adresse"
    initial: "192.168.178.255"
    min: 7
    max: 15
    mode: text

input_number:
  isoft_wunschwasserhaerte_eingabe:
    name: "i-soft Wunschwasserhärte"
    min: 0
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: "°"
    icon: mdi:water-opacity

  isoft_salzmangel_warnung_eingabe:
    name: "i-soft Salzmangel-Warnung"
    min: 0
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: "Tage"
    icon: mdi:alert-circle-outline

  isoft_max_entnahmemenge_eingabe:
    name: "i-soft Max. Entnahmemenge"
    min: 100
    max: 3000
    step: 100
    mode: slider
    unit_of_measurement: "L"
    icon: mdi:water-minus

  isoft_max_volumenstrom_eingabe:
    name: "i-soft Max. Volumenstrom"
    min: 500
    max: 5000
    step: 250
    mode: slider
    unit_of_measurement: "L/h"
    icon: mdi:speedometer

  isoft_urlaubsmodus_tage:
    name: "i-soft Urlaubstage"
    min: 1
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: "Tage"
    icon: mdi:beach

input_select:
  isoft_haerteeinheit_auswahl:
    name: "i-soft Härteeinheit"
    options:
      - "0 - °dH"
      - "1 - °eH"
      - "2 - °fH"
      - "3 - gpg"
      - "4 - ppm"
      - "5 - mmol"
      - "6 - mval"
    icon: mdi:format-letter-case

  isoft_szene_auswahl:
    name: "i-soft Szene"
    options:
      - "0 - Alltag meistern"
      - "1 - Körper pflegen"
      - "2 - Garten bewässern"
      - "3 - Urlaub genießen"
      - "4 - Wäsche waschen"
      - "5 - Hochdruckreinigen"
      - "6 - Pool befüllen"
      - "7 - Heizung befüllen"
      - "8 - Custom Szene 1"
      - "9 - Custom Szene 2"
      - "A - Custom Szene 3"
    icon: mdi:palette-swatch

  isoft_szene_dauer_auswahl:
    name: "i-soft Szenendauer"
    options:
      - "15 Minuten - 000F"
      - "30 Minuten - 001E"
      - "45 Minuten - 002D"
      - "60 Minuten / 1 Std - 0100"
      - "2 Stunden - 0200"
      - "6 Stunden - 0600"
      - "12 Stunden - 0C00"
      - "Dauerhaft - FFFF"
    icon: mdi:timer-outline

  isoft_entnahmedauer_auswahl:
    name: "i-soft Max. Entnahmedauer"
    options:
      - "10 min"
      - "20 min"
      - "30 min"
      - "40 min"
      - "50 min"
      - "60 min"
      - "70 min"
      - "80 min"
      - "90 min"
      - "120 min"
      - "150 min"
      - "180 min"
      - "210 min"
      - "240 min"
      - "270 min"
      - "300 min"
      - "330 min"
      - "360 min"
      - "390 min"
      - "420 min"
      - "450 min"
      - "480 min"
      - "510 min"
      - "540 min"
      - "570 min"
      - "600 min"
    icon: mdi:timer-cog

# ------------------------------------------------------------------------------
# 2. REST COMMANDS (SCHREIBEN)
# ------------------------------------------------------------------------------
rest_command:
  isoft_regeneration_starten:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/350000"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_wunschwasserhaerte_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3000{{ '%02X' | format(haerte | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_szene_aktivieren:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3600{{ '%02X' | format(szene | int) }}{{ dauer_hex | upper }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_szene_zuruecksetzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3800{{ '%02X' | format(szene | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_salzmangel_warnung_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/5700{{ '%02X' | format(tage | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_haerteeinheit_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/2400{{ '%02X' | format(einheit_id | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_leckageschutz_schliessen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3C00"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_leckageschutz_oeffnen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3D00"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_max_entnahmedauer_setzen:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/3E00{{ '%02X' | format(minuten | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_max_entnahmemenge_setzen:
    url: >-
      http://{{ states('input_text.isoft_ip') }}/api/rest/3F00{{ '%02X' | format((liter | int) % 256) }}{{ '%02X' | format((liter | int) // 256) }}
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_max_volumenstrom_setzen:
    url: >-
      http://{{ states('input_text.isoft_ip') }}/api/rest/4000{{ '%02X' | format((liter_pro_stunde | int) % 256) }}{{ '%02X' | format((liter_pro_stunde | int) // 256) }}
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

  isoft_urlaubsmodus_starten:
    url: "http://{{ states('input_text.isoft_ip') }}/api/rest/410001{{ '%02X' | format(tage | int) }}"
    method: POST
    authentication: basic
    username: "admin"
    password: "Connectivity"

# ==============================================================================
# 3. SENSOREN (LESEN VIA REST)
# ==============================================================================
# --- 1. Einstellungen & Grenzwerte ---
sensor:
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/5100" # Wunschwasserhaerte lesen
    username: "admin"
    password: "Connectivity"
    scan_interval: 60
    name: "i-soft Wunschwasserhaerte (JUDO Rohwert)"
    unique_id: isoft_wunschwasserhaerte_raw
    icon: mdi:water-softener
    unit_of_measurement: "°dH"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
        {{ (hex[2:4] ~ hex[0:2]) | int(base=16) }}
      {% else %}
        {{ states('sensor.isoft_wunschwasserhaerte_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_wunschwasserhaerte_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/2300" # Haerteeinheit lesen
    username: "admin"
    password: "Connectivity"
    scan_interval: 60
    name: "i-soft Haerteeinheit (JUDO Rohwert)"
    unique_id: isoft_haerteeinheit_raw
    icon: mdi:format-letter-case
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set units = ['°dH', '°eH', '°fH', 'gpg', 'ppm', 'mmol', 'mval'] %}
        {% set idx = value_json.data[0:2] | int(base=16) %}
        {{ units[idx] if idx < units | length else 'Unbekannt' }}
      {% else %}
        {{ states('sensor.isoft_haerteeinheit_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_haerteeinheit_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/5700" # Salzreichweitenmangelwarnung lesen
    username: "admin"
    password: "Connectivity"
    scan_interval: 60
    name: "i-soft Salzmangel Warnschwelle (JUDO Rohwert)"
    unique_id: isoft_salzmangel_warnschwelle_raw
    icon: mdi:alert-circle-outline
    unit_of_measurement: "Tage"
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {{ value_json.data[0:2] | int(base=16) }}
      {% else %}
        {{ states('sensor.isoft_salzmangel_warnschwelle_raw') }}
      {% endif %}


  # --- 2. Salz & Verbrauch ---
    default_entity_id: sensor.isoft_salzmangel_warnschwelle_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/5600" # Salzvorrat & Reichweite lesen
    username: "admin"
    password: "Connectivity"
    scan_interval: 60
    name: "i-soft Salzgewicht (JUDO Rohwert)"
    unique_id: isoft_salzgewicht_raw
    icon: mdi:salt-shaker
    unit_of_measurement: "kg"
    value_template: >-
      {% if value_json is defined and value_json.data is defined and value_json.data | length >= 8 %}
        {% set hex = value_json.data %}
        {% set weight_g = (hex[2:4] ~ hex[0:2]) | int(base=16) %}
        {{ (weight_g / 1000) | round(2) }}
      {% else %}
        {{ states('sensor.isoft_salzgewicht_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_salzgewicht_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/5600"
    username: "admin"
    password: "Connectivity"
    scan_interval: 60
    name: "i-soft Salzreichweite (JUDO Rohwert)"
    unique_id: isoft_salzreichweite_raw
    icon: mdi:calendar-clock
    unit_of_measurement: "Tage"
    value_template: >-
      {% if value_json is defined and value_json.data is defined and value_json.data | length >= 8 %}
        {% set hex = value_json.data %}
        {{ (hex[6:8] ~ hex[4:6]) | int(base=16) }}
      {% else %}
        {{ states('sensor.isoft_salzreichweite_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_salzreichweite_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/2800" # Gesamtwassermenge
    username: "admin"
    password: "Connectivity"
    scan_interval: 180
    name: "i-soft Gesamtwassermenge (JUDO Rohwert)"
    unique_id: isoft_gesamtwassermenge_raw
    icon: mdi:water-pump
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
        {% set liters = (hex[6:8] ~ hex[4:6] ~ hex[2:4] ~ hex[0:2]) | int(base=16) %}
        {{ (liters / 1000) | round(3) }}
      {% else %}
        {{ states('sensor.isoft_gesamtwassermenge_raw') }}
      {% endif %}

    default_entity_id: sensor.isoft_gesamtwassermenge_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/2900" # Weichwassermenge
    username: "admin"
    password: "Connectivity"
    scan_interval: 180
    name: "i-soft Weichwassermenge (JUDO Rohwert)"
    unique_id: isoft_weichwassermenge_raw
    icon: mdi:water-check
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    value_template: >-
      {% if value_json is defined and value_json.data is defined %}
        {% set hex = value_json.data %}
        {% set liters = (hex[6:8] ~ hex[4:6] ~ hex[2:4] ~ hex[0:2]) | int(base=16) %}
        {{ (liters / 1000) | round(3) }}
      {% else %}
        {{ states('sensor.isoft_weichwassermenge_raw') }}
      {% endif %}


  # --- 3. Leckageschutz & Überwachung ---
    default_entity_id: sensor.isoft_weichwassermenge_raw
  - platform: rest
    resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/3E00" # Max. Entnahmedauer
    username: "admin"
    password: "Connectivity"
    scan_interval: 120
    name: "i-soft Max Entnahmedauer (JUDO Rohwert)"
