# --- 4. Geräte- & Infodaten ---
- resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/FF00" # Gerätetyp
  username: "admin"
  password: "Connectivity"
  scan_interval: 86400
  sensor:
    - name: "i-soft Geraetetyp"
      unique_id: isoft_geraetetyp
      icon: mdi:chip
      value_template: >-
        {% if value_json is defined and value_json.data is defined %}
          {% set typ = value_json.data[0:2] | upper %}
          {% if typ in ['58', '4B'] %}
            i-soft PRO
          {% elif typ == '4C' %}
            i-soft PRO L
          {% else %}
            {{ typ }}
          {% endif %}
        {% else %}
          {{ states('sensor.isoft_geraetetyp') }}
        {% endif %}

- resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/0600" # Gerätenummer laut API-Doku
  username: "admin"
  password: "Connectivity"
  scan_interval: 86400
  sensor:
    - name: "i-soft Gerätenummer"
      unique_id: isoft_geraetenummer
      icon: mdi:identifier
      value_template: >-
        {% if value_json is defined and value_json.data is defined %}
          {% set hex = value_json.data %}
          {% if hex | length >= 8 %}
            {{ (hex[6:8] ~ hex[4:6] ~ hex[2:4] ~ hex[0:2]) | int(base=16) }}
          {% else %}
            {{ states('sensor.isoft_geraetenummer') }}
          {% endif %}
        {% else %}
          {{ states('sensor.isoft_geraetenummer') }}
        {% endif %}

- resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/0100" # Firmware Version
  username: "admin"
  password: "Connectivity"
  scan_interval: 86400
  sensor:
    - name: "i-soft Firmware Version"
      unique_id: isoft_firmware_version
      icon: mdi:file-code-outline
      value_template: >-
        {% if value_json is defined and value_json.data is defined and value_json.data | length >= 6 %}
          {% set hex = value_json.data %}
          {# Die Doku zeigt 0C0001 als Version 1.0.12: Byte-Reihenfolge ist daher rückwärts. #}
          {{ (hex[4:6]|int(base=16)) ~ '.' ~ (hex[2:4]|int(base=16)) ~ '.' ~ (hex[0:2]|int(base=16)) }}
        {% else %}
          {{ states('sensor.isoft_firmware_version') }}
        {% endif %}

- resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/2500" # Betriebstage
  username: "admin"
  password: "Connectivity"
  scan_interval: 3600
  sensor:
    - name: "i-soft Betriebstage"
      unique_id: isoft_betriebstage
      icon: mdi:clock-outline
      value_template: >-
        {% if value_json is defined and value_json.data is defined and value_json.data | length >= 8 %}
          {% set hex = value_json.data %}
          {% set minutes = hex[0:2] | int(base=16) %}
          {% set hours = hex[2:4] | int(base=16) %}
          {% set days = (hex[4:8]) | int(base=16) %}
          {{ days }} Tage, {{ hours }} Stunden
        {% else %}
          {{ states('sensor.isoft_betriebstage') }}
        {% endif %}

- resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/0E00" # Inbetriebnahmedatum
  username: "admin"
  password: "Connectivity"
  scan_interval: 86400
  sensor:
    - name: "i-soft Inbetriebnahmedatum"
      unique_id: isoft_inbetriebnahme
      icon: mdi:calendar-start
      device_class: date
      value_template: >-
        {% if value_json is defined and value_json.data is defined and value_json.data | length >= 8 %}
          {% set hex = value_json.data %}
          {% set day = hex[0:2] | int(base=16) %}
          {% set month = hex[2:4] | int(base=16) %}
          {% set year = (hex[4:8] | int(base=16)) %}
          {{ '%04d-%02d-%02d' | format(year, month, day) }}
        {% else %}
          {{ states('sensor.isoft_inbetriebnahme') }}
        {% endif %}

- resource_template: "http://{{ states('input_text.isoft_ip') }}/api/rest/5800" # Kundendienst Telefon
