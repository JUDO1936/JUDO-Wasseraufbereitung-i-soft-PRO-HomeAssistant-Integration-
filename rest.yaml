      unique_id: isoft_gesamtwassermenge
      icon: mdi:water-pump
      unit_of_measurement: "m³"
      device_class: water
      state_class: total_increasing
      value_template: >-
        {% if value_json is defined and value_json.data is defined %}
          {% set hex = value_json.data %}
          {% set liters = (hex[6:8] ~ hex[4:6] ~ hex[2:4] ~ hex[0:2]) | int(base=16) %}
          {{ (liters / 1000) | round(3) }}
        {% else %}
          {{ states('sensor.isoft_gesamtwassermenge') }}
        {% endif %}

