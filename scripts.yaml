# 1. Wunschwasserhärte setzen
judo_set_wunschwasserhaerte:
  alias: "JUDO - Wunschwasserhärte setzen"
  mode: single
  fields:
    haerte:
      description: "Wunschhärte in °dH (z. B. 6)"
      example: 6
  sequence:
    - service: rest_command.isoft_wunschwasserhaerte_setzen
      data:
        haerte: "{{ haerte }}"
    - delay:
        seconds: 2
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.i_soft_wunschwasserhaerte

# 2. Härtemesseinheit setzen
judo_set_haertemesseinheit:
  alias: "JUDO - Härtemesseinheit setzen"
  mode: single
  fields:
    einheit_id:
      description: "Einheits-ID (0=°dH, 1=°eH, 2=°fH, 3=gpg, 4=ppm, 5=mmol, 6=mval)"
      example: 0
  sequence:
    - service: rest_command.isoft_haerteeinheit_setzen
      data:
        einheit_id: "{{ einheit_id }}"
    - delay:
        seconds: 2
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.i_soft_haerteeinheit

# 3. Leckageschutz: Max Entnahmedauer
judo_set_max_entnahmedauer:
  alias: "JUDO - Max Entnahmedauer setzen"
  mode: single
